<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <radialGradient id="sun-burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="glow-filter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Neon Border -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" stroke="#22D3EE" stroke-width="12" />

  <!-- Solar Sunburst Glow in Background -->
  <circle cx="340" cy="180" r="180" fill="url(#sun-burst)" />
  
  <!-- Sun Ray Beams -->
  <g opacity="0.6" stroke="#FBBF24" stroke-width="4" stroke-linecap="round">
    <line x1="340" y1="180" x2="480" y2="60" />
    <line x1="340" y1="180" x2="500" y2="180" />
    <line x1="340" y1="180" x2="460" y2="300" />
    <line x1="340" y1="180" x2="340" y2="360" />
    <line x1="340" y1="180" x2="200" y2="60" />
    <line x1="340" y1="180" x2="340" y2="0" />
  </g>

  <!-- Stars -->
  <circle cx="100" cy="120" r="3" fill="#FFFFFF" opacity="0.8" />
  <circle cx="160" cy="80" r="2" fill="#38BDF8" opacity="0.9" />
  <circle cx="420" cy="400" r="3" fill="#FDE047" opacity="0.8" />
  <circle cx="90" cy="380" r="2.5" fill="#FFFFFF" opacity="0.7" />

  <!-- Orbit Ring -->
  <ellipse cx="256" cy="256" rx="210" ry="85" fill="none" stroke="#06B6D4" stroke-width="3" stroke-dasharray="10 8" opacity="0.5" transform="rotate(-30 256 256)" />

  <!-- Satellite Body & Solar Panels (Tilted View) -->
  <g transform="translate(70, 70) rotate(22)">

    <!-- Left Solar Wing -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="110" height="60" rx="8" fill="url(#panel-grad)" stroke="#38BDF8" stroke-width="4" />
      <line x1="36" y1="0" x2="36" y2="60" stroke="#082F49" stroke-width="3" />
      <line x1="73" y1="0" x2="73" y2="60" stroke="#082F49" stroke-width="3" />
      <line x1="0" y1="30" x2="110" y2="30" stroke="#082F49" stroke-width="3" />
      <!-- Panel Glow Highlights -->
      <rect x="5" y="5" width="26" height="20" fill="#E0F2FE" opacity="0.3" />
      <rect x="41" y="5" width="27" height="20" fill="#E0F2FE" opacity="0.3" />
    </g>

    <!-- Left Connector -->
    <rect x="130" y="183" width="25" height="14" fill="#94A3B8" rx="2" />

    <!-- Satellite Core Cylinder -->
    <g transform="translate(155, 140)">
      <!-- Main Metallic Body -->
      <rect x="0" y="0" width="70" height="100" rx="16" fill="#1E293B" stroke="#94A3B8" stroke-width="4" />
      <rect x="10" y="10" width="50" height="80" rx="10" fill="#0F172A" />
      
      <!-- Cyan Core Lens / Sensor -->
      <circle cx="35" cy="50" r="18" fill="#0284C7" stroke="#38BDF8" stroke-width="3" />
      <circle cx="35" cy="50" r="10" fill="#22D3EE" filter="url(#glow-filter)" />
      
      <!-- Gold accents -->
      <rect x="15" y="20" width="40" height="4" fill="#F59E0B" />
      <rect x="15" y="76" width="40" height="4" fill="#F59E0B" />
    </g>

    <!-- Antenna / Transmitter Nose -->
    <path d="M 190,140 L 190,105" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round" />
    <circle cx="190" cy="100" r="8" fill="#38BDF8" filter="url(#glow-filter)" />

    <!-- Right Connector -->
    <rect x="225" y="183" width="25" height="14" fill="#94A3B8" rx="2" />

    <!-- Right Solar Wing -->
    <g transform="translate(250, 160)">
      <rect x="0" y="0" width="110" height="60" rx="8" fill="url(#panel-grad)" stroke="#38BDF8" stroke-width="4" />
      <line x1="36" y1="0" x2="36" y2="60" stroke="#082F49" stroke-width="3" />
      <line x1="73" y1="0" x2="73" y2="60" stroke="#082F49" stroke-width="3" />
      <line x1="0" y1="30" x2="110" y2="30" stroke="#082F49" stroke-width="3" />
      <!-- Panel Glow Highlights -->
      <rect x="5" y="5" width="26" height="20" fill="#E0F2FE" opacity="0.3" />
      <rect x="41" y="5" width="27" height="20" fill="#E0F2FE" opacity="0.3" />
    </g>
  </g>
</svg>