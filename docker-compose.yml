services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${DB_NAME:-techx_solar}
      MYSQL_USER: ${DB_USER:-solar_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme_app}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-changeme_root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "5002:5002"
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_SSL: "0"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
