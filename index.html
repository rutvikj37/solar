<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceToRoof.com | AI Solar Intelligence</title>
    <meta name="description" content="SpaceToRoof.com — AI solar intelligence for residential installers." />
    <meta property="og:title" content="SpaceToRoof.com | AI Solar Intelligence" />
    <meta property="og:description" content="AI-powered property intelligence for residential solar companies." />
    <link rel="preload" as="image" href="/solar-home-hero.jpg" fetchpriority="high" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('str_theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(t);
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font CSS (avoids render-blocking Google Fonts) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=optional"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=optional"
      media="print"
      onload="this.media='all'"
    />

      <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=optional" rel="stylesheet" />

    </noscript>
  </head>

  </body>
